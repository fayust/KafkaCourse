      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    command: [ "sh", "-c", "mkdir -p /kafka-logs && chown -R 1000:1000 /kafka-logs && /etc/confluent/docker/run" ]
    user: root
    #volumes:  #снаружи контейнера
    #  - /c/Kafka/KafkaLogs:/kafka-logs
    depends_on:
      - zookeeper

  kafka3:
    image: confluentinc/cp-kafka:latest
